<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Admin</title>
</head>
<body>
    <div class="container">
        <h1>Calendar Admin</h1>
        
        <div id="status" class="status">Loading...</div>
        
        <h2>Current Live Event Override</h2>
        <div class="event-form" style="background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3);">
            <div style="margin-bottom: 15px; color: #ffcccc; font-size: 14px;">
                <strong>⚠️ Live Override:</strong> This will immediately show as "LIVE" on the homepage, overriding the scheduled events.
            </div>
            <div class="form-row">
                <label>Live Event Name:</label>
                <input type="text" id="liveEventName" placeholder="Enter live event name">
            </div>
            <div class="form-row">
                <label>Live Event Type:</label>
                <input type="text" id="liveEventType" placeholder="Enter live event type">
            </div>
            <button onclick="setLiveEvent()" style="background: linear-gradient(45deg, #ff4444, #cc0000);">🔴 Set as Live Now</button>
            <button onclick="clearLiveEvent()" style="background: linear-gradient(45deg, #666666, #444444);">Clear Live Override</button>
            <div id="liveEventStatus" style="margin-top: 10px; padding: 10px; border-radius: 5px; display: none;"></div>
        </div>
        
        <h2>Add New Event</h2>
        <div class="event-form">
            <div class="form-row">
                <label>Date & Time:</label>
                <input type="datetime-local" id="newEventDate">
            </div>
            <div class="form-row">
                <label>Name:</label>
                <input type="text" id="newEventName" placeholder="Event name">
            </div>
            <div class="form-row">
                <label>Type:</label>
                <input type="text" id="newEventType" placeholder="Event type">
            </div>
            <button onclick="addEvent()">Add Event</button>
        </div>
        
        <h2>Current Events</h2>
        <div id="eventsList"></div>
        
        <div class="actions">
            <button onclick="loadEvents()">Reload Events</button>
            <button onclick="clearAllEvents()">Clear All Events</button>
        </div>
    </div>

    <script src="/js/calendar.js"></script>
</body>
</html>
