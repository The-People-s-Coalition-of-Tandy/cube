<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Stress Test - The Cube</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
        .controls { margin-bottom: 20px; }
        .stats { background: #333; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .viewer { margin: 5px 0; padding: 8px; background: #444; border-radius: 3px; font-size: 12px; }
        .viewer.connected { background: #2d5a2d; }
        .viewer.error { background: #5a2d2d; }
        .viewer.disconnected { background: #5a5a2d; }
        button { padding: 10px 20px; margin: 5px; background: #555; color: #fff; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #666; }
        button:disabled { background: #333; cursor: not-allowed; }
        .test-options { background: #333; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .test-options label { display: block; margin: 5px 0; }
        .test-options input[type="checkbox"] { margin-right: 10px; }
        .test-options input[type="range"] { width: 200px; margin: 0 10px; }
        .performance-chart { background: #333; padding: 15px; margin: 10px 0; border-radius: 5px; height: 200px; }
    </style>
</head>
<body>
    <h1>WebSocket Stress Test - The Cube</h1>
    
    <div class="controls">
        <button onclick="startTest(5)">Start 5 Viewers</button>
        <button onclick="startTest(10)">Start 10 Viewers</button>
        <button onclick="startTest(25)">Start 25 Viewers</button>
        <button onclick="startTest(50)">Start 50 Viewers</button>
        <button onclick="startTest(100)">Start 100 Viewers</button>
        <button onclick="startTest(200)">Start 200 Viewers</button>
        <button onclick="stopTest()" style="background: #aa4444;">Stop All</button>
    </div>
    
    <div class="test-options">
        <h3>Test Options</h3>
        <label>
            <input type="checkbox" id="enableMovement" checked> Enable Random Movement
        </label>
        <label>
            <input type="checkbox" id="enableChat" checked> Enable Random Chat Messages
        </label>
        <label>
            <input type="checkbox" id="enableHeartbeat" checked> Enable Heartbeat (Ping/Pong)
        </label>
        <label>
            Movement Speed: <input type="range" id="movementSpeed" min="50" max="500" value="150"> 
            <span id="movementSpeedValue">150ms</span>
        </label>
        <label>
            Chat Frequency: <input type="range" id="chatFrequency" min="1000" max="30000" value="10000"> 
            <span id="chatFrequencyValue">10s</span>
        </label>
    </div>
    
    <div class="stats">
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;">
            <div>
                <strong>Active Connections:</strong> <span id="activeCount">0</span><br>
                <strong>Peak Connections:</strong> <span id="peakCount">0</span>
            </div>
            <div>
                <strong>Messages Sent:</strong> <span id="messagesSent">0</span><br>
                <strong>Messages Received:</strong> <span id="messagesReceived">0</span>
            </div>
            <div>
                <strong>Errors:</strong> <span id="errorCount">0</span><br>
                <strong>Reconnects:</strong> <span id="reconnectCount">0</span>
            </div>
            <div>
                <strong>Avg Latency:</strong> <span id="avgLatency">0ms</span><br>
                <strong>Messages/sec:</strong> <span id="messagesPerSec">0</span>
            </div>
        </div>
    </div>
    
    <div class="performance-chart">
        <h3>Performance Monitor</h3>
        <canvas id="performanceChart" width="800" height="150"></canvas>
    </div>
    
    <div id="viewers"></div>
    
    <script>
        let viewers = [];
        let messagesSent = 0;
        let messagesReceived = 0;
        let errorCount = 0;
        let reconnectCount = 0;
        let peakConnections = 0;
        let latencySum = 0;
        let latencyCount = 0;
        let messagesPerSecond = 0;
        let lastMessageCount = 0;
        
        // Performance tracking
        let performanceData = [];
        const maxDataPoints = 60; // 1 minute of data at 1 second intervals
        
        // Test usernames and colors
        const testUsernames = [
            "StressTest_Alpha", "StressTest_Beta", "StressTest_Gamma", "StressTest_Delta",
            "TestUser_001", "TestUser_002", "TestUser_003", "TestUser_004",
            "LoadTest_A", "LoadTest_B", "LoadTest_C", "LoadTest_D",
            "Viewer_X", "Viewer_Y", "Viewer_Z", "Observer_1", "Observer_2"
        ];
        
        const testColors = [
            '#ff4444', '#44ff44', '#4444ff', '#ffff44', 
            '#ff44ff', '#44ffff', '#ff8844', '#8844ff'
        ];
        
        const chatMessages = [
            "Hello from stress test!", "Testing the system", "How's the performance?",
            "Stress test in progress", "Multiple users online", "System load test",
            "WebSocket stress test", "Performance monitoring", "Load testing active"
        ];
        
        function updateStats() {
            const activeConnections = viewers.filter(v => v.ws && v.ws.readyState === WebSocket.OPEN).length;
            peakConnections = Math.max(peakConnections, activeConnections);
            
            document.getElementById('activeCount').textContent = activeConnections;
            document.getElementById('peakCount').textContent = peakConnections;
            document.getElementById('messagesSent').textContent = messagesSent;
            document.getElementById('messagesReceived').textContent = messagesReceived;
            document.getElementById('errorCount').textContent = errorCount;
            document.getElementById('reconnectCount').textContent = reconnectCount;
            
            const avgLatency = latencyCount > 0 ? Math.round(latencySum / latencyCount) : 0;
            document.getElementById('avgLatency').textContent = avgLatency + 'ms';
            document.getElementById('messagesPerSec').textContent = messagesPerSecond;
            
            // Update performance chart
            performanceData.push({
                time: Date.now(),
                connections: activeConnections,
                messagesPerSec: messagesPerSecond,
                avgLatency: avgLatency
            });
            
            if (performanceData.length > maxDataPoints) {
                performanceData.shift();
            }
            
            drawPerformanceChart();
        }
        
        function drawPerformanceChart() {
            const canvas = document.getElementById('performanceChart');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            if (performanceData.length < 2) return;
            
            // Draw connections line (blue)
            ctx.strokeStyle = '#4444ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            performanceData.forEach((point, index) => {
                const x = (index / (maxDataPoints - 1)) * width;
                const y = height - (point.connections / 200) * height; // Scale to max 200 connections
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Draw messages/sec line (green)
            ctx.strokeStyle = '#44ff44';
            ctx.beginPath();
            performanceData.forEach((point, index) => {
                const x = (index / (maxDataPoints - 1)) * width;
                const y = height - (point.messagesPerSec / 100) * height; // Scale to max 100 msg/sec
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Draw latency line (red)
            ctx.strokeStyle = '#ff4444';
            ctx.beginPath();
            performanceData.forEach((point, index) => {
                const x = (index / (maxDataPoints - 1)) * width;
                const y = height - (point.avgLatency / 1000) * height; // Scale to max 1000ms
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();
            
            // Draw legend
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText('Blue: Connections, Green: Msg/sec, Red: Latency', 10, 20);
        }
        
        function createViewer(id) {
            const ws = new WebSocket('ws://localhost:3001');
            const viewerDiv = document.createElement('div');
            viewerDiv.className = 'viewer';
            viewerDiv.id = `viewer-${id}`;
            viewerDiv.innerHTML = `Viewer ${id}: Connecting...`;
            document.getElementById('viewers').appendChild(viewerDiv);
            
            const username = testUsernames[id % testUsernames.length] + '_' + id;
            const color = testColors[id % testColors.length];
            
            const viewer = {
                id: id,
                ws: ws,
                username: username,
                color: color,
                position: [Math.random() * 10 - 5, Math.random() * 3 + 1, Math.random() * 10 - 5],
                div: viewerDiv,
                moveInterval: null,
                chatInterval: null,
                heartbeatInterval: null,
                lastPingTime: 0,
                connected: false
            };
            
            ws.onopen = () => {
                viewer.connected = true;
                viewerDiv.innerHTML = `${username}: Connected`;
                viewerDiv.className = 'viewer connected';
                
                // Send user data (username and color)
                setTimeout(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'set_user_data',
                            username: username,
                            color: color
                        }));
                        messagesSent++;
                    }
                }, 100);
                
                // Start movement if enabled
                if (document.getElementById('enableMovement').checked) {
                    const moveSpeed = parseInt(document.getElementById('movementSpeed').value);
                    viewer.moveInterval = setInterval(() => {
                        // Random walk
                        viewer.position[0] += (Math.random() - 0.5) * 0.3;
                        viewer.position[1] += (Math.random() - 0.5) * 0.1;
                        viewer.position[2] += (Math.random() - 0.5) * 0.3;
                        
                        // Keep within bounds
                        viewer.position[0] = Math.max(-10, Math.min(10, viewer.position[0]));
                        viewer.position[1] = Math.max(0.5, Math.min(5, viewer.position[1]));
                        viewer.position[2] = Math.max(-10, Math.min(10, viewer.position[2]));
                        
                        // Send position update
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: 'position_update',
                                position: viewer.position
                            }));
                            messagesSent++;
                        }
                    }, moveSpeed + Math.random() * 100);
                }
                
                // Start chat if enabled
                if (document.getElementById('enableChat').checked) {
                    const chatFreq = parseInt(document.getElementById('chatFrequency').value);
                    viewer.chatInterval = setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN && Math.random() < 0.3) { // 30% chance
                            const message = chatMessages[Math.floor(Math.random() * chatMessages.length)];
                            ws.send(JSON.stringify({
                                type: 'chat_message',
                                message: message
                            }));
                            messagesSent++;
                        }
                    }, chatFreq + Math.random() * 5000);
                }
                
                // Start heartbeat if enabled
                if (document.getElementById('enableHeartbeat').checked) {
                    viewer.heartbeatInterval = setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN) {
                            viewer.lastPingTime = Date.now();
                            ws.send(JSON.stringify({ type: 'ping' }));
                            messagesSent++;
                        }
                    }, 5000 + Math.random() * 2000); // 5-7 seconds
                }
            };
            
            ws.onmessage = (event) => {
                messagesReceived++;
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'pong' && viewer.lastPingTime > 0) {
                        const latency = Date.now() - viewer.lastPingTime;
                        latencySum += latency;
                        latencyCount++;
                        viewer.lastPingTime = 0;
                    }
                    
                    viewerDiv.innerHTML = `${username}: ${data.type} (${messagesReceived})`;
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };
            
            ws.onerror = (error) => {
                errorCount++;
                viewerDiv.innerHTML = `${username}: Error`;
                viewerDiv.className = 'viewer error';
                console.error(`Viewer ${id} error:`, error);
            };
            
            ws.onclose = () => {
                viewer.connected = false;
                viewerDiv.innerHTML = `${username}: Disconnected`;
                viewerDiv.className = 'viewer disconnected';
                
                // Clear intervals
                if (viewer.moveInterval) clearInterval(viewer.moveInterval);
                if (viewer.chatInterval) clearInterval(viewer.chatInterval);
                if (viewer.heartbeatInterval) clearInterval(viewer.heartbeatInterval);
                
                // Auto-reconnect after 2-5 seconds if test is still running
                if (viewers.includes(viewer)) {
                    setTimeout(() => {
                        if (viewers.includes(viewer)) {
                            reconnectCount++;
                            const newViewer = createViewer(id);
                            const index = viewers.indexOf(viewer);
                            viewers[index] = newViewer;
                            viewer.div.remove();
                        }
                    }, 2000 + Math.random() * 3000);
                }
            };
            
            return viewer;
        }
        
        function startTest(count) {
            console.log(`Starting stress test with ${count} viewers`);
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const viewer = createViewer(viewers.length + 1);
                    viewers.push(viewer);
                    updateStats();
                }, i * 100); // Stagger connections by 100ms
            }
        }
        
        function stopTest() {
            console.log('Stopping all viewers');
            viewers.forEach(viewer => {
                if (viewer.ws && viewer.ws.readyState === WebSocket.OPEN) {
                    viewer.ws.close();
                }
                if (viewer.moveInterval) clearInterval(viewer.moveInterval);
                if (viewer.chatInterval) clearInterval(viewer.chatInterval);
                if (viewer.heartbeatInterval) clearInterval(viewer.heartbeatInterval);
                if (viewer.div) viewer.div.remove();
            });
            viewers = [];
            messagesSent = 0;
            messagesReceived = 0;
            errorCount = 0;
            reconnectCount = 0;
            peakConnections = 0;
            latencySum = 0;
            latencyCount = 0;
            performanceData = [];
            updateStats();
        }
        
        // Update range input displays
        document.getElementById('movementSpeed').oninput = function() {
            document.getElementById('movementSpeedValue').textContent = this.value + 'ms';
        };
        
        document.getElementById('chatFrequency').oninput = function() {
            document.getElementById('chatFrequencyValue').textContent = Math.round(this.value / 1000) + 's';
        };
        
        // Update stats and calculate messages per second
        setInterval(() => {
            const currentMessages = messagesReceived;
            messagesPerSecond = currentMessages - lastMessageCount;
            lastMessageCount = currentMessages;
            updateStats();
        }, 1000);
        
        // Initial stats update
        updateStats();
    </script>
</body>
</html>
